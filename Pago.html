<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h3 class="mb-4 text-center">Formulario de Pago 😉</h3>

        <form class="was-validated">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombres</label>
            <input type="text" class="form-control" id="nombre" required>
            <div class="invalid-feedback">Este campo es obligatorio.</div>
          </div>

          <div class="mb-3">
            <label for="apellido" class="form-label">Apellidos</label>
            <input type="text" class="form-control" id="apellido" required>
            <div class="invalid-feedback">Este campo es obligatorio.</div>
          </div>

          <div class="mb-3">
            <label for="pais" class="form-label">País</label>
            <select class="form-select" id="pais" required>
                 <option value="">Selecciona un País</option>
                 <option>El Salvador</option>
                <option>México</option>
                <option>Guatemala</option>
                 <option>Honduras</option>
                 <option>Nicaragua</option>
                <option>Costa Rica</option>
                <option>Panamá</option>

            </select>
            <div class="invalid-feedback">Selecciona un país válido.</div>
          </div>

           <div class="mb-3">
            <label for="tarjeta" class="form-label">N° Tarjeta</label>
            <input type="text" class="form-control" id="CreditCard" required>
            <div class="invalid-feedback">Este campo es obligatorio.</div>
          </div>

           <div class="mb-3">
            <label for="caducidad" class="form-label">Fecha de caducidad</label>
            <input type="month" class="form-control" id="Caducidad" required>
            <div class="invalid-feedback">Este campo es obligatorio.</div>
          </div>

           <div class="mb-3">
            <label for="CVV" class="form-label">CVV</label>
            <input type="text" class="form-control" id="CVV" required>
            <div class="invalid-feedback">Este campo es obligatorio.</div>
          </div>
          

          </form>
        <div class="d-grid gap-2 col-6 mx-auto">
  <a href="index.html" class="btn btn-primary" role="button">Realizar el Pago</a>
</div>

</body>
</html>
